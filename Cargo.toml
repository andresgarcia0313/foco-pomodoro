[workspace]
resolver = "2"
members = ["crates/foco-core", "crates/foco-app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Andrés García <andresgarcia0313@gmail.com>"]

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

# Faster local builds (docs/05-despliegue/compilacion.md): line tables only for our crates,
# no debug info for dependencies, which are rarely stepped through.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Published builds: smallest and fastest binary, slow to compile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Local install and manual testing: optimized, but without the slow LTO and single unit.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
