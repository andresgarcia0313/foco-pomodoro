[workspace]
resolver = "2"
members = ["crates/foco-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Andrés García <andresgarcia0313@gmail.com>"]

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
