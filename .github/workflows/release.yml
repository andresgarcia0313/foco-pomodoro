name: Release

# A v* tag publishes a release; a manual run only builds and tests the packages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only token by default; only the publish job may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: deb ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:trixie", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Build tools and Qt from the distribution
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential ca-certificates curl git \
            pkg-config dpkg-dev file librsvg2-bin libgl-dev qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools qt6-multimedia-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.image }}
      - run: cargo build -p foco-app --release
        env:
          QMAKE: /usr/bin/qmake6
      - id: pkg
        run: echo "deb=$(scripts/empaquetar-deb.sh target/release/foco)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: ${{ steps.pkg.outputs.deb }}

  deb-test:
    name: test ${{ matrix.image }}
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:trixie", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ strategy.job-index }}
          path: dist
      - run: scripts/probar-deb.sh dist/*.deb

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # aqtinstall 3.3 finds no Windows packages for Qt 6.11 and later yet.
          version: 6.10.3
          aqtversion: ==3.3.*
          modules: qtmultimedia
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p foco-app --release
      - name: Portable folder with Qt and the C++ runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Foco | Out-Null
          Copy-Item target/release/foco.exe dist/Foco/
          windeployqt --release --qmldir qml --qmldir crates/foco-app/qml dist/Foco/foco.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -find 'VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT\*.dll' |
            Where-Object { $_ -notmatch 'onecore' } | Copy-Item -Destination dist/Foco/
          Copy-Item packaging/windows/foco.ico, LICENSE dist/Foco/
      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
          FOCO_AUTOQUIT_MS: "5000"
          FOCO_CONFIG_DIR: ${{ runner.temp }}\foco
        run: |
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*\Qt\*' }) -join ';'
          $p = Start-Process dist/Foco/foco.exe -ArgumentList --mute -Wait -PassThru `
            -RedirectStandardError smoke.log
          Get-Content smoke.log
          if ($p.ExitCode -ne 0) { throw "foco.exe terminó con $($p.ExitCode)" }
          if (Select-String -Path smoke.log -Pattern 'qrc:.*(Error|error|is not a type)|is not installed') { throw 'QML reportó errores' }
          if (-not (Test-Path "$env:FOCO_CONFIG_DIR\foco.json")) { throw 'no guardó foco.json' }
      - name: Zip and installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Compress-Archive dist/Foco "dist/Foco-$v-windows-x64.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $env:FOCO_VERSION = $v
          iscc packaging/windows/foco.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: 6.12.0
          modules: qtmultimedia
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p foco-app --release
      - name: Foco.app with Qt inside, ad hoc signed
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=dist/Foco.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/foco "$app/MacOS/"
          cp packaging/macos/foco.icns "$app/Resources/"
          sed "s/@VERSION@/$v/g" packaging/macos/Info.plist > "$app/Info.plist"
          macdeployqt dist/Foco.app -qmldir=qml -qmldir=crates/foco-app/qml
          # macdeployqt rewrites the binaries; Apple Silicon refuses to run them unsigned.
          codesign --force --deep --sign - dist/Foco.app
          echo "V=$v" >> "$GITHUB_ENV"
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          FOCO_AUTOQUIT_MS: "5000"
          FOCO_CONFIG_DIR: ${{ runner.temp }}/foco
        # Without the toolchain's Qt paths: the bundle must carry every plugin it needs.
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH
          dist/Foco.app/Contents/MacOS/foco --mute 2> smoke.log || { cat smoke.log; exit 1; }
          cat smoke.log
          ! grep -E "qrc:.*(Error|error|ReferenceError|TypeError|is not a type)|is not installed" smoke.log
          test -f "$FOCO_CONFIG_DIR/foco.json"
      - name: Disk image
        run: |
          ln -s /Applications dist/Applications
          hdiutil create -volname Foco -srcfolder dist -ov -format UDZO \
            "Foco-$V-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Foco-*.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb-test, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
