[package]
name = "foco-app"
description = "Foco desktop app: CXX-Qt bridge between foco-core and the QML interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "foco"
path = "src/main.rs"

[dependencies]
foco-core = { path = "../foco-core" }
chrono.workspace = true
cxx = "1.0.202"
cxx-qt = "0.10.0"
# Only core types are used from Rust (QString, QVariant, QList, QMap, QUrl); the GUI,
# QML and Controls parts live in src/app_shim.cpp, so qt_full would only add C++ to build.
cxx-qt-lib = "0.10.0"
dirs = "6.0.0"
notify-rust = "4.18.2"

[build-dependencies]
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
